<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#09090b" />
  <title>EV.Daily — 전기차 뉴스</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=DM+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: 'DM Sans', system-ui, sans-serif; background: #09090b; }
    .font-serif { font-family: 'Fraunces', Georgia, serif; font-optical-sizing: auto; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner { animation: spin 0.8s linear infinite; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel" data-presets="react">
    const { useState, useEffect } = React;

    const COUNTRIES = [
      { key: 'korea', label: '한국', sub: 'KR' },
      { key: 'japan', label: '일본', sub: 'JP' },
      { key: 'us', label: '미국', sub: 'US' },
    ];

    const SEVEN_DAYS_MS = 7 * 24 * 60 * 60 * 1000;

    function formatRelativeTime(dateStr) {
      if (!dateStr) return '';
      const date = new Date(dateStr);
      const diff = (Date.now() - date.getTime()) / 1000;
      if (isNaN(diff)) return '';
      if (diff < 60) return '방금 전';
      if (diff < 3600) return `${Math.floor(diff / 60)}분 전`;
      if (diff < 86400) return `${Math.floor(diff / 3600)}시간 전`;
      return `${Math.floor(diff / 86400)}일 전`;
    }

    function buildMailtoLink(news) {
      const subject = `[EV.Daily] ${news.title}`;
      const body = [
        '안녕하세요,',
        '',
        'EV.Daily에서 흥미로운 뉴스가 있어 공유드립니다.',
        '',
        `[${news.category || 'EV'}] ${news.title}`,
        '',
        '[요약]',
        news.summary || '',
        '',
        '[원문 링크]',
        news.source_url || '',
        '',
        `출처: ${news.source || ''}`,
        '',
        '─────────────────────',
        'EV.Daily by GLISIS',
      ].join('\n');
      return `mailto:?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
    }

    function EVNewsApp() {
      const [country, setCountry] = useState('korea');
      const [cache, setCache] = useState({});
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState(null);
      const [bookmarks, setBookmarks] = useState(new Set());
      const [showXlsxMenu, setShowXlsxMenu] = useState(false);
      const [showPptMenu, setShowPptMenu] = useState(false);
      const [pptLoading, setPptLoading] = useState(false);

      const today = new Date().toLocaleDateString('ko-KR', {
        year: 'numeric', month: 'long', day: 'numeric', weekday: 'long',
      });

      async function loadNews(targetCountry, force = false) {
        if (!force && cache[targetCountry]) return;
        setLoading(true);
        setError(null);
        try {
          const res = await fetch(`/api/news?country=${targetCountry}`);
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const data = await res.json();
          setCache((prev) => ({ ...prev, [targetCountry]: data.items || [] }));
        } catch (e) {
          setError(e.message);
        } finally {
          setLoading(false);
        }
      }

      useEffect(() => { loadNews(country); }, [country]);

      // Close menus on outside click
      useEffect(() => {
        if (!showXlsxMenu && !showPptMenu) return;
        const handler = () => {
          setShowXlsxMenu(false);
          setShowPptMenu(false);
        };
        const t = setTimeout(() => document.addEventListener('click', handler), 0);
        return () => {
          clearTimeout(t);
          document.removeEventListener('click', handler);
        };
      }, [showXlsxMenu, showPptMenu]);

      const toggleBookmark = (id) => {
        setBookmarks((prev) => {
          const next = new Set(prev);
          if (next.has(id)) next.delete(id); else next.add(id);
          return next;
        });
      };

      const handleXlsxDownload = (range) => {
        window.location.href = `/api/export?range=${range}`;
        setShowXlsxMenu(false);
      };

      const handlePptDownload = async (range) => {
        setShowPptMenu(false);
        setPptLoading(true);
        try {
          const res = await fetch(`/api/ppt?range=${range}`);
          if (!res.ok) {
            const err = await res.json().catch(() => ({}));
            throw new Error(err.error || `HTTP ${res.status}`);
          }
          const blob = await res.blob();
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          const filename = res.headers.get('Content-Disposition')
            ?.match(/filename="(.+?)"/)?.[1] || `EV-Report-${range}.pptx`;
          a.href = url;
          a.download = filename;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
        } catch (e) {
          alert(`PPT 생성 실패: ${e.message}`);
        } finally {
          setPptLoading(false);
        }
      };

      const allItems = cache[country] || [];
      const items = allItems.filter((n) => {
        if (!n.pub_date) return true;
        return Date.now() - new Date(n.pub_date).getTime() < SEVEN_DAYS_MS;
      });
      const feed = COUNTRIES.find((c) => c.key === country);

      return (
        <div className="min-h-screen bg-zinc-950 text-zinc-100">
          <div className="max-w-md mx-auto">
            <header className="px-5 pt-8 pb-5 border-b border-zinc-800">
              <div className="flex items-center justify-between mb-3">
                <div className="flex items-center gap-2">
                  <div className="w-2 h-2 rounded-full bg-lime-400 animate-pulse"></div>
                  <span className="font-mono text-[10px] tracking-widest text-lime-400 uppercase">Daily</span>
                </div>
                <img
                  src="/logo.png"
                  alt="GLISIS Global Solution"
                  className="h-7 w-auto opacity-90"
                  style={{ filter: 'brightness(0) invert(1)' }}
                />
              </div>
              <h1 className="font-serif text-4xl font-bold tracking-tight leading-none">
                EV<span className="text-lime-400">.</span>Daily
              </h1>
              <p className="mt-2 text-sm text-zinc-400">
                전기차 시장의 모든 것, 매일 아침
                <span className="block mt-0.5 font-mono text-[10px] text-zinc-600 uppercase tracking-wider">{today}</span>
              </p>
            </header>

            <div className="px-5 pt-4 pb-3 border-b border-zinc-900">
              <div className="grid grid-cols-3 gap-1 bg-zinc-900 rounded-xl p-1">
                {COUNTRIES.map((f) => (
                  <button
                    key={f.key}
                    onClick={() => setCountry(f.key)}
                    className={`py-2.5 rounded-lg text-sm font-semibold transition-all ${
                      country === f.key ? 'bg-lime-400 text-zinc-950' : 'text-zinc-400 hover:text-zinc-200'
                    }`}
                  >
                    <div>{f.label}</div>
                    <div className="font-mono text-[9px] tracking-widest opacity-60 mt-0.5">{f.sub}</div>
                  </button>
                ))}
              </div>
            </div>

            <div className="px-5 py-3 flex items-center justify-between text-[11px] font-mono uppercase tracking-wider text-zinc-500 border-b border-zinc-900">
              <span>{loading ? '불러오는 중...' : `${items.length}건 · 최근 7일`}</span>
              <div className="flex items-center gap-3 relative">
                <button
                  onClick={() => loadNews(country, true)}
                  disabled={loading}
                  className="text-lime-400 hover:text-lime-300 disabled:opacity-50"
                >↻ 새로고침</button>

                <button
                  onClick={(e) => { e.stopPropagation(); setShowXlsxMenu((v) => !v); setShowPptMenu(false); }}
                  className="text-zinc-400 hover:text-lime-400 transition-colors"
                  title="엑셀 다운로드"
                >📥 엑셀</button>

                <button
                  onClick={(e) => { e.stopPropagation(); setShowPptMenu((v) => !v); setShowXlsxMenu(false); }}
                  disabled={pptLoading}
                  className="text-zinc-400 hover:text-lime-400 transition-colors disabled:opacity-60"
                  title="PPT 다운로드"
                >{pptLoading ? '⏳ 생성중' : '📊 PPT'}</button>

                {showXlsxMenu && (
                  <div
                    onClick={(e) => e.stopPropagation()}
                    className="absolute right-0 top-7 z-10 w-44 bg-zinc-900 border border-zinc-800 rounded-lg shadow-xl overflow-hidden"
                  >
                    <button
                      onClick={() => handleXlsxDownload('week')}
                      className="w-full px-4 py-3 text-left text-xs font-medium text-zinc-200 hover:bg-zinc-800 normal-case tracking-normal"
                    >
                      <div className="text-zinc-100">이번 주</div>
                      <div className="text-[10px] text-zinc-500 mt-0.5">최근 7일치</div>
                    </button>
                    <button
                      onClick={() => handleXlsxDownload('month')}
                      className="w-full px-4 py-3 text-left text-xs font-medium text-zinc-200 hover:bg-zinc-800 normal-case tracking-normal border-t border-zinc-800"
                    >
                      <div className="text-zinc-100">이번 달</div>
                      <div className="text-[10px] text-zinc-500 mt-0.5">최근 30일치</div>
                    </button>
                    <button
                      onClick={() => handleXlsxDownload('all')}
                      className="w-full px-4 py-3 text-left text-xs font-medium text-zinc-200 hover:bg-zinc-800 normal-case tracking-normal border-t border-zinc-800"
                    >
                      <div className="text-zinc-100">전체</div>
                      <div className="text-[10px] text-zinc-500 mt-0.5">DB 전체 아카이브</div>
                    </button>
                  </div>
                )}

                {showPptMenu && (
                  <div
                    onClick={(e) => e.stopPropagation()}
                    className="absolute right-0 top-7 z-10 w-48 bg-zinc-900 border border-zinc-800 rounded-lg shadow-xl overflow-hidden"
                  >
                    <div className="px-4 py-2 text-[10px] text-zinc-500 border-b border-zinc-800 bg-zinc-950">
                      임원 보고용 5장 리포트
                    </div>
                    <button
                      onClick={() => handlePptDownload('week')}
                      className="w-full px-4 py-3 text-left text-xs font-medium text-zinc-200 hover:bg-zinc-800 normal-case tracking-normal"
                    >
                      <div className="text-zinc-100">이번 주</div>
                      <div className="text-[10px] text-zinc-500 mt-0.5">최근 7일 · 약 20초 소요</div>
                    </button>
                    <button
                      onClick={() => handlePptDownload('month')}
                      className="w-full px-4 py-3 text-left text-xs font-medium text-zinc-200 hover:bg-zinc-800 normal-case tracking-normal border-t border-zinc-800"
                    >
                      <div className="text-zinc-100">이번 달</div>
                      <div className="text-[10px] text-zinc-500 mt-0.5">최근 30일 · 약 25초 소요</div>
                    </button>
                  </div>
                )}
              </div>
            </div>

            {pptLoading && (
              <div className="mx-5 my-4 p-3 bg-zinc-900/50 border border-zinc-800 rounded-lg flex items-center gap-3">
                <div className="w-4 h-4 border-2 border-zinc-700 border-t-lime-400 rounded-full spinner"></div>
                <p className="text-xs text-zinc-300">
                  PPT 생성 중... AI가 이번 주 뉴스를 분석하고 있어요
                </p>
              </div>
            )}

            {loading && items.length === 0 && (
              <div className="py-20 flex flex-col items-center gap-3">
                <div className="w-6 h-6 border-2 border-zinc-800 border-t-lime-400 rounded-full spinner"></div>
                <p className="text-xs text-zinc-500 font-mono uppercase tracking-wider">Loading</p>
              </div>
            )}

            {error && !loading && (
              <div className="mx-5 my-6 p-4 border border-red-900/50 bg-red-950/30 rounded-lg">
                <p className="text-sm text-red-400 mb-2">불러오기 실패</p>
                <p className="text-xs text-zinc-500 font-mono">{error}</p>
                <button onClick={() => loadNews(country, true)} className="mt-3 text-xs px-3 py-1.5 rounded-full bg-zinc-900 border border-zinc-800">다시 시도</button>
              </div>
            )}

            {!loading && !error && items.length === 0 && (
              <div className="py-16 px-5 text-center">
                <p className="text-sm text-zinc-400 mb-2">최근 7일 이내 뉴스가 없어요</p>
                <p className="text-xs text-zinc-500">cron이 실행되면 자동으로 채워집니다</p>
              </div>
            )}

            {!loading && items.length > 0 && (
              <main className="divide-y divide-zinc-900">
                {items.map((news) => (
                  <article key={news.id} className="px-5 py-6 hover:bg-zinc-900/40 transition-colors">
                    <div className="flex items-start justify-between gap-3 mb-3">
                      <div className="flex items-center gap-2 text-[10px] font-mono uppercase tracking-wider min-w-0">
                        <span className="text-lime-400 truncate">{news.category || 'EV'}</span>
                      </div>
                      <span className="font-mono text-[10px] text-zinc-600 whitespace-nowrap">{formatRelativeTime(news.pub_date)}</span>
                    </div>

                    <h2 className="font-serif text-[19px] leading-snug font-semibold mb-3 text-zinc-50">
                      {news.title}
                    </h2>

                    <p className="text-[13.5px] text-zinc-300 leading-relaxed mb-4">
                      {news.summary}
                    </p>

                    <div className="flex items-center justify-between gap-3 pt-3 border-t border-zinc-900">
                      <a
                        href={news.source_url}
                        target="_blank"
                        rel="noopener noreferrer"
                        className="flex items-center gap-2 text-xs text-zinc-500 hover:text-lime-400 transition-colors min-w-0"
                      >
                        <span className="font-mono uppercase tracking-wider text-[10px] shrink-0">참조</span>
                        <span className="truncate">{news.source} ↗</span>
                      </a>

                      <div className="flex items-center gap-2 shrink-0">
                        <a
                          href={buildMailtoLink(news)}
                          title="이메일로 공유"
                          className="text-xs font-medium px-3 py-1.5 rounded-full border border-zinc-800 text-zinc-500 hover:border-lime-400 hover:text-lime-400 transition-all"
                        >✉</a>

                        <button
                          onClick={() => toggleBookmark(news.id)}
                          title={bookmarks.has(news.id) ? '북마크 해제' : '북마크'}
                          className={`text-xs font-medium px-3 py-1.5 rounded-full border transition-all ${
                            bookmarks.has(news.id) ? 'border-lime-400 bg-lime-400/10 text-lime-400' : 'border-zinc-800 text-zinc-500 hover:border-zinc-700'
                          }`}
                        >{bookmarks.has(news.id) ? '★' : '☆'}</button>
                      </div>
                    </div>
                  </article>
                ))}
              </main>
            )}

            <footer className="px-5 py-8 text-center border-t border-zinc-900">
              <p className="font-mono text-[10px] tracking-widest text-zinc-600 uppercase">Updated daily by Claude AI</p>
              <p className="mt-2 text-[10px] text-zinc-700">EV.Daily · 매일 새벽 6시 자동 업데이트</p>
            </footer>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<EVNewsApp />);
  </script>
</body>
</html>
